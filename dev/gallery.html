<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery test</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { margin: 0; overflow: hidden; }
  #c { position: fixed; inset: 0; }
  #bar { position: fixed; left: 8px; bottom: 8px; display: flex; gap: 6px; z-index: 5; flex-wrap: wrap; }
  #log { position: fixed; left: 8px; top: 8px; color: #ddd; font: 12px monospace; z-index: 5; }
</style>
<script type="importmap">
  { "imports": { "three": "../vendor/three-0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="c"></div>
<div id="log"></div>
<div id="bar"></div>
<script type="module">
// Development page: run the gallery choreography step by step.
import { Gallery } from '../js/gallery.js';
import { WORKS, HOSTS, SPECIES } from '../js/data.js';
import { t } from '../js/strings.js';
const q = new URLSearchParams(location.search);
const work = WORKS.find(w => w.id === (q.get('work') || 'eden'));
const host = HOSTS[q.get('host') || work.hosts[0]];
const sp = SPECIES.find(s => s.id === (q.get('species') || 'red_fox'));
const style = q.get('style') || 'storybook';
const base = '../';
const fix = o => { for (const k of ['hd', 'depth']) o[k] = base + o[k]; return o; };
const meta = await (await fetch('../assets/hosts/hosts.json')).json();
const img = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = base + (style === 'photo' ? sp.cutout : sp.storybook); });
const g = window.g = new Gallery(document.getElementById('c'), {
  work: fix({ ...work }), workText: t(`works.${work.id}`), visitorImage: img, visitorHead: sp.faces,
  visitorLit: style === 'photo', visitorGait: sp.gait,
  host: { ...host, sprite: base + host.sprite, patch: base + host.patch }, hostMeta: meta[host.id],
});
await g.init();
const log = m => document.getElementById('log').textContent = m;
const steps = { walkIn: () => g.walkIn(), lookBack: () => g.lookBack(1), approach: () => g.approach(),
  wake: () => g.wakeHost(), enter: () => g.enter(), refuse: () => g.hostRefuses() };
for (const [k, f] of Object.entries(steps)) {
  const b = document.createElement('button'); b.className = 'btn small'; b.textContent = k;
  b.onclick = async () => { log(k + '…'); await f(); log(k + ' done'); };
  document.getElementById('bar').appendChild(b);
}
addEventListener('pointermove', e => { g.parallax.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)); });
addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') g.walkVisitorToScreen(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)); });
log('ready');
</script>
</body>
</html>
