<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk test</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 12px monospace; }
  canvas { display: block; }
  #info { position: fixed; left: 8px; top: 8px; }
</style>
<script type="importmap">
  { "imports": { "three": "../vendor/three-0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="info"></div>
<script type="module">
// Development page: walks several characters back and forth to check the rig.
import * as THREE from 'three';
import { Character } from '../js/character.js';
import { SPECIES } from '../js/data.js';

const style = new URLSearchParams(location.search).get('style') || 'storybook';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1714);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
cam.position.set(0, 1.6, 9); cam.lookAt(0, 1.2, 0);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), new THREE.MeshBasicMaterial({ color: 0x2a2520 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const chars = [];
const only = new URLSearchParams(location.search).get('only');
for (const [i, s] of SPECIES.filter(x => !only || x.id === only).entries()) {
  const img = await load('../' + (style === 'photo' ? s.cutout : s.storybook));
  const c = new Character(img, { headSide: s.faces, lit: style === 'photo', height: 0.55, gait: s.gait }).addTo(scene);
  if (only) { c.setHeight(2.2); c.position.set(-2.2, 0, 2); } else c.position.set(-4 + (i % 5) * 2, 0, -1 + Math.floor(i / 5) * 1.6);
  c.home = c.position.clone(); c.leg = 0; chars.push(c);
}
document.getElementById('info').textContent = chars.map(c => `${c.rig.type} legs=${c.rig.legs.length}`).join(' | ');
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  for (const c of chars) {
    if (!c.target) c.walkTo(c.home.clone().add(new THREE.Vector3(c.leg++ % 2 ? 0 : (only ? 3.6 : 1.2), 0, 0)), 0.55);
    c.update(dt, t);
  }
  renderer.render(scene, cam);
});
</script>
</body>
</html>
