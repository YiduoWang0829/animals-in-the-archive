<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Animals in the Archive</title>
  <meta name="description" content="An interactive digital collection: send an animal from a photographic archive into three paintings, meet the animal painted there, and sculpt them together.">
  <meta name="author" content="Yiduo Wang">
  <meta name="theme-color" content="#0d0c0b">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js is vendored locally (see vendor/) and resolved through this import map -->
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three-0.170.0/build/three.module.js",
        "three/addons/": "./vendor/three-0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="#" data-action="home">
      <span class="brand-mark" aria-hidden="true">AiA</span>
      <span class="brand-name" data-i18n="siteTitle"></span>
    </a>
    <nav class="nav">
      <a href="#" data-action="home" data-i18n="navCollection"></a>
      <a href="#" data-action="credits" data-i18n="navCredits"></a>
    </nav>
  </header>

  <main>
    <!-- 1 · Collection index -->
    <section id="view-index" class="view is-active" aria-labelledby="index-title">
      <div class="intro">
        <p class="kicker" data-i18n="siteKicker"></p>
        <h1 id="index-title" class="display" data-i18n="siteTitle"></h1>
        <p class="lede" data-i18n="siteIntro"></p>
      </div>
      <div class="index-head">
        <h2 class="caption-heading" data-i18n="indexHeading"></h2>
        <span class="caption" id="index-count"></span>
      </div>
      <ol class="catalogue" id="catalogue"></ol>
    </section>

    <!-- 5 · Gallery and the painting space (three.js) -->
    <section id="view-stage" class="view" aria-label="Gallery">
      <div class="stage3d" id="stage3d"></div>
      <div class="stage-status" id="stage-status" aria-live="polite"></div>
      <div class="control-bar glass" id="stage-controls"></div>
    </section>

    <!-- 6 · Create: sculpt (3D) or a new painting (2D) -->
    <section id="view-create" class="view" aria-label="Create">
      <div class="create-modes glass" role="tablist" id="create-modes"></div>
      <div class="sculpt-canvas" id="sculpt-canvas"></div>
      <div class="compose-wrap" id="compose-wrap" hidden><canvas id="compose-canvas"></canvas></div>
      <div class="sculpt-status glass" id="create-status"></div>
      <div class="hand-cursor" id="hand-cursor" hidden></div>
      <div class="hand-cursor second" id="hand-cursor-2" hidden></div>
      <div class="control-bar glass sculpt-tools" id="create-tools"></div>
    </section>

    <!-- Credits -->
    <section id="view-credits" class="view" aria-labelledby="credits-title">
      <div class="intro narrow">
        <h1 id="credits-title" class="display small" data-i18n="creditsHeading"></h1>
        <div id="credits-body" class="credits"></div>
      </div>
    </section>
  </main>

  <footer class="footer caption" data-i18n="footer"></footer>

  <!-- speech bubbles float above the 3D scene -->
  <div class="bubble-layer" id="bubble-layer" aria-live="polite"></div>

  <!-- camera chip: shows when the camera is on; the video never leaves this tab -->
  <div class="cam-chip glass" id="cam-chip" hidden>
    <video id="cam-video" playsinline muted></video>
    <button class="btn small ghost" data-action="cam-stop" data-i18n="camStop"></button>
  </div>

  <!-- One reusable frosted-glass modal -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-scrim" data-action="close-modal"></div>
    <div class="modal-panel glass" id="modal-panel"></div>
  </div>


  <!-- Opened by double-click (file://)? Browsers block ES modules there, so js/app.js
       never runs. This plain script still runs and explains what to do. (Its text
       cannot come from js/strings.js, because that module is the part that is blocked.) -->
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var d = document.createElement('div');
        d.className = 'file-warning glass';
        d.innerHTML = '<strong>This site needs a local web server.</strong>' +
          '<p>Browsers block its scripts when the page is opened as a file. In Terminal, run:</p>' +
          '<code>cd ' + decodeURI(location.pathname.replace(/\/index\.html$/, '')) + ' &amp;&amp; python3 -m http.server 8000</code>' +
          '<p>then open <b>http://localhost:8000</b>. Online (GitHub Pages) it works directly.</p>';
        document.body.prepend(d);
      });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
